<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>商务拜访执行 Agent - Phase 4/5</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #262b36;
    --text: #e6e8ec;
    --dim: #8b909c;
    --accent: #5b8cff;
    --ok: #35c98f;
    --warn: #e0a83c;
    --err: #e05c5c;
    --user: #2a2f3c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 32px 16px;
  }
  .wrap { width: 100%; max-width: 1080px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  .sub { color: var(--dim); font-size: 13px; margin-bottom: 20px; }
  .status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--dim);
    margin-bottom: 16px;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #555;
    transition: background 0.2s;
  }
  .dot.connected { background: var(--ok); box-shadow: 0 0 8px var(--ok); }

  /* 主体：左边日志流，右边 Checklist 侧边栏 */
  .main-row {
    display: flex;
    gap: 16px;
    align-items: flex-start;
  }
  .main-col { flex: 1; min-width: 0; }
  .side-col {
    width: 260px;
    flex-shrink: 0;
    position: sticky;
    top: 24px;
  }

  .checklist-panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
  }
  .checklist-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--dim);
    letter-spacing: 0.02em;
    margin-bottom: 4px;
  }
  .checklist-progress {
    font-size: 12px;
    color: var(--dim);
    margin-bottom: 14px;
  }
  .checklist-progress .num { color: var(--accent); font-weight: 700; }
  .checklist-items { list-style: none; margin: 0; padding: 0; }
  .checklist-items li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 4px;
    font-size: 13.5px;
    color: var(--dim);
    transition: color 0.2s;
  }
  .checklist-items li + li { border-top: 1px solid var(--border); }
  .checklist-items li.done { color: var(--text); }
  .check-box {
    flex-shrink: 0;
    width: 18px; height: 18px;
    border-radius: 6px;
    border: 1.5px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    transition: all 0.2s;
  }
  .checklist-items li.done .check-box {
    background: var(--ok);
    border-color: var(--ok);
    color: #06251a;
  }

  .log {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 8px;
    min-height: 420px;
    max-height: 68vh;
    overflow-y: auto;
    margin-bottom: 12px;
  }
  .entry {
    padding: 10px 12px;
    border-radius: 8px;
    animation: fadein 0.25s ease;
    margin-bottom: 2px;
  }
  .entry:hover { background: #1d212b; }
  .row { display: flex; gap: 10px; align-items: flex-start; }
  .tag {
    flex-shrink: 0;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.02em;
    padding: 3px 9px;
    border-radius: 999px;
    white-space: nowrap;
    margin-top: 1px;
  }
  .text { font-size: 14px; white-space: pre-wrap; line-height: 1.55; }
  pre {
    margin: 6px 0 0 0;
    font-size: 12.5px;
    background: #0b0d12;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    overflow-x: auto;
    color: #b9c0cf;
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* Goal */
  .entry.goal .tag { background: var(--user); color: var(--text); }
  .entry.goal .text { font-weight: 600; }

  /* Reasoning：高亮展示，这是"决策来自现场推理"的核心证据 */
  .entry.reasoning {
    background: rgba(91, 140, 255, 0.08);
    border-left: 3px solid var(--accent);
    padding-left: 10px;
  }
  .entry.reasoning .tag { background: rgba(91, 140, 255, 0.2); color: var(--accent); }

  /* Tool call */
  .entry.tool_call .tag { background: rgba(224, 168, 60, 0.18); color: var(--warn); }

  /* Tool result */
  .entry.tool_result .tag { background: rgba(139, 144, 156, 0.18); color: var(--dim); }
  .entry.tool_result.status-failed pre,
  .entry.tool_result.status-error pre,
  .entry.tool_result.status-over_budget pre { border-color: var(--err); }
  .entry.tool_result.status-success pre { border-color: var(--ok); }

  /* Thinking placeholder */
  .entry.thinking .text { color: var(--dim); font-style: italic; }

  /* Done / Error */
  .entry.done { border-left: 3px solid var(--ok); padding-left: 10px; }
  .entry.done .tag { background: rgba(53, 201, 143, 0.18); color: var(--ok); }
  .entry.error { border-left: 3px solid var(--err); padding-left: 10px; }
  .entry.error .tag { background: rgba(224, 92, 92, 0.18); color: var(--err); }

  .placeholder { color: var(--dim); font-size: 13px; padding: 12px; }

  /* 人工审批卡片：需要明显区别于普通日志条目 */
  .approval-card {
    background: rgba(224, 168, 60, 0.08);
    border: 1.5px solid var(--warn);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 2px;
    animation: fadein 0.25s ease;
  }
  .approval-card .approval-title {
    font-size: 12px;
    font-weight: 700;
    color: var(--warn);
    letter-spacing: 0.02em;
    margin-bottom: 8px;
  }
  .approval-card .approval-reason {
    font-size: 14px;
    line-height: 1.55;
    margin-bottom: 8px;
  }
  .approval-card .approval-action {
    font-size: 13px;
    color: var(--dim);
    margin-bottom: 12px;
  }
  .approval-card .approval-action b { color: var(--text); font-weight: 600; }
  .approval-btns { display: flex; gap: 8px; }
  .approval-btns button {
    flex: 1;
    padding: 9px 0;
    border-radius: 8px;
    border: none;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-approve { background: var(--ok); color: #06251a; }
  .btn-reject { background: transparent; color: var(--err); border: 1.5px solid var(--err) !important; }
  .approval-card.resolved .approval-btns { display: none; }
  .approval-card.resolved .approval-result {
    font-size: 13px;
    font-weight: 700;
    padding: 6px 10px;
    border-radius: 6px;
    display: inline-block;
  }
  .approval-card.resolved.approved .approval-result { background: rgba(53, 201, 143, 0.18); color: var(--ok); }
  .approval-card.resolved.rejected .approval-result { background: rgba(224, 92, 92, 0.18); color: var(--err); }

  /* 最终报告：执行层 / 决策层 二分展示 */
  .report-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px 0;
    margin-bottom: 2px;
    animation: fadein 0.25s ease;
  }
  .report-section { padding: 14px 16px; }
  .report-section + .report-section { border-top: 1px solid var(--border); }
  .report-section-title {
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: 0.02em;
    margin-bottom: 10px;
  }
  .report-section.execution .report-section-title { color: var(--ok); }
  .report-section.decision .report-section-title { color: var(--warn); }
  .report-section ul { margin: 0; padding-left: 18px; }
  .report-section li { font-size: 13.5px; line-height: 1.6; margin-bottom: 6px; }
  .report-section li:last-child { margin-bottom: 0; }
  .report-empty { font-size: 13px; color: var(--dim); font-style: italic; }

  .input-row { display: flex; gap: 8px; }
  #goal {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    color: var(--text);
    font-size: 14px;
    outline: none;
  }
  #goal:focus { border-color: var(--accent); }
  #start {
    background: var(--accent);
    border: none;
    border-radius: 10px;
    padding: 0 20px;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  #start:disabled { opacity: 0.5; cursor: not-allowed; }

  @keyframes fadein {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 760px) {
    .main-row { flex-direction: column; }
    .side-col { width: 100%; position: static; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>商务拜访执行 Agent</h1>
    <div class="sub">Phase 4/5 · 人工审批卡片 + 执行层/决策层最终报告 —— 该不该申请审批、审批被拒后怎么办，都由模型现场决定；批不批准，是你的决定</div>
    <div class="status">
      <span class="dot" id="dot"></span>
      <span id="status-text">连接中…</span>
    </div>

    <div class="main-row">
      <div class="main-col">
        <div class="log" id="log">
          <div class="placeholder" id="placeholder">在下面输入一个目标，点"开始任务"，观察模型自己规划、遇到问题自己重新决策的过程…</div>
        </div>
        <div class="input-row">
          <input id="goal" type="text"
                 value="下周二安排去上海拜访客户，把事情办妥"
                 autocomplete="off" />
          <button id="start">开始任务</button>
        </div>
      </div>

      <div class="side-col">
        <div class="checklist-panel">
          <div class="checklist-title">VERIFIER · 完成标准</div>
          <div class="checklist-progress"><span class="num" id="checklist-done">0</span> / <span id="checklist-total">5</span> 项已完成</div>
          <ul class="checklist-items" id="checklist-items"></ul>
        </div>
      </div>
    </div>
  </div>

<script>
  const dot = document.getElementById("dot");
  const statusText = document.getElementById("status-text");
  const logEl = document.getElementById("log");
  const placeholder = document.getElementById("placeholder");
  const goalInput = document.getElementById("goal");
  const startBtn = document.getElementById("start");
  const checklistItemsEl = document.getElementById("checklist-items");
  const checklistDoneEl = document.getElementById("checklist-done");
  const checklistTotalEl = document.getElementById("checklist-total");

  // 默认展示的 5 项（在第一次收到后端的 checklist 消息之前先占位显示，
  // 后端消息到达后会用真实的 key/label 覆盖，顺序以后端为准）
  const DEFAULT_CHECKLIST_LABELS = {
    flight: "航班已确认",
    hotel: "酒店已确认",
    meeting: "客户会面时间已确认",
    calendar_sync: "日历事件已同步",
    email: "确认邮件已发送",
  };

  let thinkingEl = null;
  let pendingApprovalEl = null; // 当前正等待用户点击的审批卡片，resolved 之后清空

  function renderChecklist(items, labels) {
    labels = labels || DEFAULT_CHECKLIST_LABELS;
    items = items || {};
    const keys = Object.keys(labels);
    checklistItemsEl.innerHTML = "";
    let doneCount = 0;
    for (const key of keys) {
      const done = !!items[key];
      if (done) doneCount++;
      const li = document.createElement("li");
      li.className = done ? "done" : "";
      li.innerHTML = `<span class="check-box">${done ? "✓" : ""}</span><span>${labels[key]}</span>`;
      checklistItemsEl.appendChild(li);
    }
    checklistDoneEl.textContent = doneCount;
    checklistTotalEl.textContent = keys.length;
  }

  // 初始渲染一份空的 Checklist，任务开始后后端会推送真实状态覆盖它
  renderChecklist({}, DEFAULT_CHECKLIST_LABELS);

  const protocol = location.protocol === "https:" ? "wss:" : "ws:";
  const ws = new WebSocket(`${protocol}//${location.host}/ws`);

  ws.onopen = () => {
    dot.classList.add("connected");
    statusText.textContent = "已连接";
    startBtn.disabled = false;
  };
  ws.onclose = () => {
    dot.classList.remove("connected");
    statusText.textContent = "连接已断开";
    startBtn.disabled = true;
  };
  ws.onerror = () => { statusText.textContent = "连接出错"; };

  function clearThinking() {
    if (thinkingEl) {
      thinkingEl.remove();
      thinkingEl = null;
    }
  }

  function appendEntry(kind, tagText, bodyHtml) {
    if (placeholder) placeholder.remove();
    const entry = document.createElement("div");
    entry.className = `entry ${kind}`;
    entry.innerHTML = `<div class="row"><span class="tag">${tagText}</span><div style="flex:1">${bodyHtml}</div></div>`;
    logEl.appendChild(entry);
    logEl.scrollTop = logEl.scrollHeight;
    return entry;
  }

  // Phase 4：渲染一张审批卡片，点击后发送 approval_response 并把卡片标记为已处理
  function renderApprovalCard(reason, proposedAction) {
    if (placeholder) placeholder.remove();
    const card = document.createElement("div");
    card.className = "approval-card";
    card.innerHTML = `
      <div class="approval-title">⏸ 需要人工审批</div>
      <div class="approval-reason">${esc(reason)}</div>
      <div class="approval-action">如果批准，将执行：<b>${esc(proposedAction)}</b></div>
      <div class="approval-btns">
        <button class="btn-reject">拒绝</button>
        <button class="btn-approve">批准</button>
      </div>
    `;
    logEl.appendChild(card);
    logEl.scrollTop = logEl.scrollHeight;

    function resolve(approved) {
      card.classList.add("resolved", approved ? "approved" : "rejected");
      const btns = card.querySelector(".approval-btns");
      const result = document.createElement("div");
      result.className = "approval-result";
      result.textContent = approved ? "✓ 已批准" : "✕ 已拒绝";
      btns.insertAdjacentElement("afterend", result);
      ws.send(JSON.stringify({ type: "approval_response", approved }));
      pendingApprovalEl = null;
    }
    card.querySelector(".btn-approve").addEventListener("click", () => resolve(true));
    card.querySelector(".btn-reject").addEventListener("click", () => resolve(false));

    pendingApprovalEl = card;
    return card;
  }

  // Phase 5：渲染执行层/决策层最终报告
  function renderFinalReport(executionLayer, decisionLayer) {
    if (placeholder) placeholder.remove();
    const card = document.createElement("div");
    card.className = "report-card";

    const execItems = (executionLayer && executionLayer.length)
      ? `<ul>${executionLayer.map((t) => `<li>${esc(t)}</li>`).join("")}</ul>`
      : `<div class="report-empty">（无内容）</div>`;
    const decisionItems = (decisionLayer && decisionLayer.length)
      ? `<ul>${decisionLayer.map((t) => `<li>${esc(t)}</li>`).join("")}</ul>`
      : `<div class="report-empty">（无内容）</div>`;

    card.innerHTML = `
      <div class="report-section execution">
        <div class="report-section-title">✅ 执行层（客观验证通过）</div>
        ${execItems}
      </div>
      <div class="report-section decision">
        <div class="report-section-title">⚠️ 决策层（建议人工复核）</div>
        ${decisionItems}
      </div>
    `;
    logEl.appendChild(card);
    logEl.scrollTop = logEl.scrollHeight;
    return card;
  }

  function esc(s) {
    const d = document.createElement("div");
    d.textContent = s;
    return d.innerHTML;
  }

  ws.onmessage = (event) => {
    const data = JSON.parse(event.data);

    if (data.type === "goal") {
      appendEntry("goal", "目标", `<span class="text">${esc(data.text)}</span>`);

    } else if (data.type === "thinking") {
      clearThinking();
      thinkingEl = appendEntry("thinking", "模型", `<span class="text">思考中…</span>`);

    } else if (data.type === "reasoning") {
      clearThinking();
      appendEntry("reasoning", "推理", `<span class="text">${esc(data.text)}</span>`);

    } else if (data.type === "tool_call") {
      clearThinking();
      appendEntry(
        "tool_call",
        "调用工具",
        `<span class="text">${esc(data.name)}</span><pre>${esc(JSON.stringify(data.arguments, null, 2))}</pre>`
      );

    } else if (data.type === "tool_result") {
      clearThinking();
      const status = (data.result && data.result.status) ? String(data.result.status) : "";
      appendEntry(
        `tool_result status-${status}`,
        "工具返回",
        `<span class="text">${esc(data.name)}</span><pre>${esc(JSON.stringify(data.result, null, 2))}</pre>`
      );

    } else if (data.type === "checklist") {
      renderChecklist(data.items, data.labels);

    } else if (data.type === "approval_request") {
      clearThinking();
      renderApprovalCard(data.reason, data.proposed_action);
      // 停在这里等用户点按钮，不主动启用开始任务按钮——任务仍在进行中

    } else if (data.type === "approval_resolved") {
      // 卡片自己在点击时已经就地更新了状态，这里不需要额外处理，
      // 只是让后端确认这一步已经收到，方便调试时对照日志

    } else if (data.type === "generating_report") {
      clearThinking();
      thinkingEl = appendEntry("thinking", "模型", `<span class="text">正在生成最终报告…</span>`);

    } else if (data.type === "final_report") {
      clearThinking();
      renderFinalReport(data.execution_layer, data.decision_layer);

    } else if (data.type === "done") {
      clearThinking();
      appendEntry("done", "完成", `<span class="text">任务已结束（模型这一轮没有再调用任何工具）。</span>`);
      startBtn.disabled = false;

    } else if (data.type === "error") {
      clearThinking();
      appendEntry("error", "出错", `<span class="text">${esc(data.text)}</span>`);
      startBtn.disabled = false;
    }
  };

  function startTask() {
    const goal = goalInput.value.trim();
    if (!goal || ws.readyState !== WebSocket.OPEN) return;
    renderChecklist({}, DEFAULT_CHECKLIST_LABELS); // 新任务开始，先把上一轮的勾选清空
    ws.send(JSON.stringify({ type: "start_task", goal }));
    startBtn.disabled = true; // 任务跑完(done/error)才重新允许点击，避免中途并发开第二个任务
  }

  startBtn.addEventListener("click", startTask);
  goalInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") startTask();
  });
</script>
</body>
</html>
